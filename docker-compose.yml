version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: traveloop
      POSTGRES_PASSWORD: traveloop
      POSTGRES_DB: traveloop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traveloop"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
